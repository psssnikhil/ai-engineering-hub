site_name: AI Engineering Hub
site_description: The free, open-source path from transformers to production AI — RAG, agents, harnesses, evals, and LLMOps.
site_url: https://psssnikhil.github.io/ai-engineering-hub/
repo_url: https://github.com/psssnikhil/ai-engineering-hub
repo_name: ai-engineering-hub
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/psssnikhil/ai-engineering-hub
  announcement:
    text: "Free open-source curriculum — 16 courses from foundations to production AI."
    link: start-here/

copyright: Copyright &copy; 2026 AI Engineering Hub contributors · MIT License

extra_javascript:
  - javascripts/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid-init.js

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: false
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore

