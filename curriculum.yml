    path: production/module-10-llmops-production-systems

  - title: LLM Evaluation & Quality
    path: production/module-19-llm-evaluation-quality

  - title: AI Safety & Ethics
    path: production/module-16-ai-safety-ethics

  # ── Part 4: Advanced ────────────────────────────────
  - title: Fine-Tuning & Custom Models
    path: advanced/module-15-fine-tuning-custom-models

  - title: Capstone Projects
    path: advanced/module-17-capstone-projects

