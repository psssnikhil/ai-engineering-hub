<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Engineering Hub Logo">
  <defs>
    <linearGradient id="aie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="aie-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#aie-grad)"/>
  
  <!-- Neural Nodes & Connections -->
  <g stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#aie-glow)">
    <line x1="20" y1="20" x2="32" y2="14"/>
    <line x1="20" y1="20" x2="32" y2="32"/>
    <line x1="20" y1="20" x2="20" y2="44"/>
    <line x1="32" y1="14" x2="44" y2="20"/>
    <line x1="32" y1="32" x2="44" y2="20"/>
    <line x1="32" y1="32" x2="44" y2="44"/>
    <line x1="20" y1="44" x2="32" y2="50"/>
    <line x1="32" y1="50" x2="44" y2="44"/>
  </g>
  
  <!-- Outer Connection Nodes -->
  <circle cx="20" cy="20" r="4" fill="#ffffff"/>
  <circle cx="32" cy="14" r="3.5" fill="#a5b4fc"/>
  <circle cx="44" cy="20" r="4" fill="#ffffff"/>
  <circle cx="32" cy="32" r="5" fill="#67e8f9"/>
  <circle cx="20" cy="44" r="4" fill="#ffffff"/>
  <circle cx="32" cy="50" r="3.5" fill="#a5b4fc"/>
  <circle cx="44" cy="44" r="4" fill="#ffffff"/>
  
  <!-- Core Glow Center -->
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
